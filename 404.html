<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Habiora</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F3EEE5;
  --card:#FDFBF6;
  --ink:#1C3A2A;
  --forest:#24412F;
  --muted:#6E7A6F;
  --line:#E4DCCD;
  --mint-a:#6EE7B7;
  --mint-b:#3FD6AE;
  --gold:#C9891F;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --header-h:68px;
  --shadow:0 18px 40px -24px rgba(28,58,42,.45);
}
*{box-sizing:border-box}
body{overflow-x:clip}
html{scroll-behavior:smooth}
body{
  margin:0; padding-top:var(--header-h); min-height:100vh;
  background:var(--cream); color:var(--ink);
  font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.6; font-weight:500;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
h1{font-family:"Fredoka",system-ui,sans-serif; font-weight:600; line-height:1.12;
   letter-spacing:-.01em; margin:0; font-size:clamp(2.1rem,4.4vw,3.1rem); text-wrap:balance}
p{margin:0}
a{color:inherit}
img,svg{max-width:100%; height:auto; display:block}
.wrap{width:min(1120px,100% - 2.5rem); margin-inline:auto}

/* ---------- header ---------- */
header{position:fixed; top:0; left:0; right:0; z-index:50; backdrop-filter:blur(12px);
       background:rgba(243,238,229,.82); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:2rem; padding:.85rem 0}
.brand{display:flex; align-items:center; gap:.6rem; font-family:"Fredoka",system-ui,sans-serif;
       font-weight:600; font-size:1.3rem; text-decoration:none}
.brand img{width:38px; height:38px; border-radius:11px}
nav{margin-left:auto; display:flex; align-items:center; gap:1.9rem}
nav a{text-decoration:none; color:var(--muted); font-weight:600; font-size:.98rem}
nav a:not(.btn):hover{color:var(--ink)}
nav .btn{padding:.68rem 1.25rem; font-size:.95rem}

/* ---------- main ---------- */
main{flex:1; display:grid; place-items:center; padding:clamp(3rem,8vw,6rem) 0}
.panel{text-align:center; max-width:46ch; margin-inline:auto}
.scene{width:clamp(150px,26vw,210px); margin:0 auto clamp(1.8rem,4vw,2.6rem)}
.lede{color:var(--muted); font-size:clamp(1.02rem,1.5vw,1.18rem); margin-top:1.1rem}
.code{color:var(--gold); font-family:"Fredoka",system-ui,sans-serif; font-weight:600;
      font-size:1.05rem; margin-bottom:.9rem}

.actions{display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center; margin-top:2.1rem}
.btn{display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
     font-family:"Fredoka",system-ui,sans-serif; font-weight:600; font-size:1rem;
     padding:.8rem 1.5rem; border-radius:999px; border:1px solid transparent;
     transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease}
.btn-primary{background:linear-gradient(135deg,var(--mint-a),var(--mint-b)); color:var(--forest);
             box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--card); border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{border-color:#CFC4AE}
.btn-ink{background:var(--ink); color:#F6F3EC}
.btn-ink:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--forest); outline-offset:3px}
.brand:focus-visible{outline:3px solid var(--forest); outline-offset:4px; border-radius:6px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:1.6rem 0; color:var(--muted); font-size:.94rem}
.foot{display:flex; flex-wrap:wrap; gap:.5rem 1.4rem; align-items:center; justify-content:space-between}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

/* one quiet moment: the seedling settles in on load */
.sprout{transform-origin:100px 132px; animation:grow .9s cubic-bezier(.2,.9,.25,1) both}
@keyframes grow{from{transform:scaleY(.25) scaleX(.7); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  html{scroll-behavior:auto}
}
@media (max-width:960px){
  nav a:not(.btn){display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <img src="/images/icon.png" alt="">
      Habiora
    </a>
    <nav>
      <a href="/#how">How it works</a>
      <a href="/#features">Features</a>
      <a href="/#pricing">Plans</a>
      <a href="/#faq">FAQ</a>
      <a href="/#waitlist" class="btn btn-ink">Join the waitlist</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">

      <svg class="scene" viewBox="0 0 200 170" role="img" aria-label="A bare patch of soil with a single seedling">
        <ellipse cx="100" cy="140" rx="74" ry="20" fill="#E4DCCD"/>
        <path d="M26 132c0-9 33-16 74-16s74 7 74 16v4c0 9-33 16-74 16s-74-7-74-16z" fill="#8A6440"/>
        <ellipse cx="100" cy="132" rx="74" ry="16" fill="#A57B4F"/>
        <ellipse cx="68" cy="128" rx="7" ry="2.6" fill="#8A6440" opacity=".55"/>
        <ellipse cx="128" cy="136" rx="9" ry="3" fill="#8A6440" opacity=".45"/>
        <ellipse cx="104" cy="122" rx="5" ry="2" fill="#8A6440" opacity=".5"/>
        <g class="sprout">
          <path d="M100 132V104" stroke="#2E7D4F" stroke-width="5" stroke-linecap="round"/>
          <path d="M100 112c-13-1-19-9-19-17 9-1 17 5 19 17z" fill="#3FD6AE"/>
          <path d="M100 106c11-2 16-10 15-18-8-1-15 6-15 18z" fill="#6EE7B7"/>
        </g>
      </svg>

      <p class="code">Error 404</p>
      <h1>Nothing planted here.</h1>
      <p class="lede">This page doesn't exist. The link may be wrong, or the page may have moved since it was shared.</p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to the homepage</a>
        <a class="btn btn-ghost" href="/#waitlist">Join the waitlist</a>
      </div>

    </div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span>&copy; 2026 Habiora</span>
    <a href="mailto:hello@habiora.co">hello@habiora.co</a>
  </div>
</footer>

</body>
</html>
